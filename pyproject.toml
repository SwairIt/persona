[project]
name = "persona"
version = "0.53.0"
description = "Persona — open-source personal AI memory. Captures screen + builds searchable life log. 100% local, zero cloud."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SwairIt", email = "112168281+SwairIt@users.noreply.github.com" },
]
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "mss>=10.0",
    "pillow>=11.0",
    "imagehash>=4.3",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "psutil>=6.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "anyio>=4.7",
    "pytesseract>=0.3.13",
]

[project.scripts]
persona = "app.main:run"
persona-capture = "app.workers.capture_runner:main"
persona-cli = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.4",
    "numpy>=1.26",
]
backup = [
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A", "RUF", "SIM", "TCH", "PL"]
ignore = ["S101", "PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]
"scripts/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["mss.*", "imagehash.*", "pygetwindow.*", "pytesseract.*", "fastembed.*", "numpy.*", "cryptography.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
