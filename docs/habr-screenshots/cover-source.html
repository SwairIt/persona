<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080d; }

  .cover {
    width: 780px; height: 440px; position: relative; overflow: hidden;
    background:
      radial-gradient(620px 420px at 12% -18%, rgba(139,92,246,.42), transparent 62%),
      radial-gradient(560px 460px at 104% 112%, rgba(232,121,249,.26), transparent 64%),
      radial-gradient(420px 360px at 96% -6%, rgba(34,211,238,.16), transparent 62%),
      #07070c;
    font-family: "Unbounded", "Trebuchet MS", sans-serif;
    color: #f4f4f5;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 34px 40px 30px;
  }

  /* горизонт событий — отсылка к чёрной дыре с лендинга */
  .hole {
    position: absolute; right: -110px; top: 50%; transform: translateY(-50%);
    width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #000 44%, rgba(167,139,250,.30) 52%, rgba(167,139,250,.06) 68%, transparent 74%);
    box-shadow: 0 0 90px 20px rgba(139,92,246,.16);
  }
  .ring {
    position: absolute; right: -110px; top: 50%; transform: translateY(-50%) rotate(-14deg);
    width: 380px; height: 380px; border-radius: 50%;
    border: 1px solid rgba(196,181,253,.22);
    box-shadow: inset 0 0 60px rgba(167,139,250,.10);
  }

  .top { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #a78bfa; box-shadow: 0 0 12px #a78bfa; }
  .brand {
    font-family: "JetBrains Mono", monospace; font-size: 12px;
    letter-spacing: .22em; text-transform: uppercase; color: #a9a3c0;
  }

  .mid { position: relative; z-index: 2; max-width: 520px; }

  h1 {
    font-weight: 800; font-size: 52px; line-height: 1.02; letter-spacing: -.025em;
    text-transform: uppercase;
  }
  h1 .accent { color: #a78bfa; }

  .sub {
    margin-top: 16px; font-family: "JetBrains Mono", monospace;
    font-size: 15px; line-height: 1.5; color: #c9c4dd; font-weight: 400;
    max-width: 440px;
  }

  .bottom {
    position: relative; z-index: 2;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  }

  .who {
    font-family: "JetBrains Mono", monospace; font-size: 12.5px; color: #8e88a8; line-height: 1.6;
  }
  .who b { color: #e9e6f5; font-weight: 700; }

  .meter { display: flex; align-items: flex-end; gap: 14px; }
  .cell { display: flex; flex-direction: column; gap: 5px; }
  .cap {
    font-family: "JetBrains Mono", monospace; font-size: 9.5px;
    letter-spacing: .16em; text-transform: uppercase; color: #7d7797;
  }
  .num { font-family: "JetBrains Mono", monospace; font-weight: 700; line-height: 1; }
  .was { font-size: 26px; color: #e0a06a; text-decoration: line-through; text-decoration-thickness: 2px; opacity: .9; }
  .now { font-size: 34px; color: #5fd2c2; }
  .arr { font-family: "JetBrains Mono", monospace; font-size: 18px; color: #6d6788; padding-bottom: 4px; }
</style>

<div class="cover">
  <div class="hole"></div>
  <div class="ring"></div>

  <div class="top">
    <span class="dot"></span>
    <span class="brand">Persona · разбор</span>
  </div>

  <div class="mid">
    <h1>Две секунды<br><span class="accent">на пустом месте</span></h1>
    <p class="sub">Каждый CSS-файл на моём сайте<br>писал в базу данных</p>
  </div>

  <div class="bottom">
    <div class="who">
      <b>Ярослав Боев</b><br>
      github.com/SwairIt/persona
    </div>
    <div class="meter">
      <div class="cell">
        <span class="cap">один файл</span>
        <span class="num was">55 мс</span>
      </div>
      <span class="arr">→</span>
      <div class="cell">
        <span class="cap">стало</span>
        <span class="num now">15 мс</span>
      </div>
    </div>
  </div>
</div>
