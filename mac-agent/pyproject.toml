[project]
name = "persona-agent"
version = "1.19.0"
description = "Persona capture agent (Windows + macOS) — local screen + microphone capture daemon that uploads to a Persona server."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SwairIt", email = "112168281+SwairIt@users.noreply.github.com" },
]
license = { text = "AGPL-3.0-or-later" }
# Light core — works on Windows + macOS without torch (~2GB). Audio VAD and
# local Whisper transcription are opt-in extras so the default install stays small.
dependencies = [
    "httpx>=0.28",
    "mss>=10.0",
    "pillow>=11.0",
    "imagehash>=4.3",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "scipy>=1.13",
    "tomli>=2.0;python_version<'3.11'",
    "click>=8.1",
    "structlog>=24.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
# Speech detection without torch. webrtcvad-wheels ships prebuilt Windows +
# macOS wheels (plain webrtcvad needs a C toolchain on Windows).
audio = [
    "webrtcvad-wheels>=2.0",
]
# Optional on-device transcription (heavy — pulls torch). When absent the
# agent uploads audio without a transcript and the server transcribes.
transcribe = [
    "silero-vad>=5.1",
    "openai-whisper>=20240930",
]
encodec = [
    "encodec>=0.1",
    "torch>=2.2",
]

[project.scripts]
persona-agent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribute the top-level modules — this is a flat package, not a tree.
only-include = ["persona_agent.py", "cli.py", "config.py", "platform_support.py", "sync_client.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "A", "RUF", "SIM", "TCH", "PL"]
# PLC0415: heavy / platform-specific deps (mss, sounddevice, whisper, torch,
#          silero-vad, encodec) are imported lazily so the CLI still loads
#          without them — e.g. on Windows during tests where mss-on-Wayland
#          is irrelevant and openai-whisper would import torch eagerly.
# S105: ENV_AGENT_TOKEN is a *variable name* string, not a secret.
ignore = ["S101", "PLC0415", "PLR0913", "PLR2004", "PLR0915", "S105"]

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts + magic constants freely.
"tests/**" = ["S", "PLR"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "mss.*",
    "imagehash.*",
    "sounddevice.*",
    "scipy.*",
    "silero_vad.*",
    "whisper.*",
    "encodec.*",
    "numpy.*",
]
ignore_errors = true
