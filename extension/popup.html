<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Persona Capture</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 12px 14px;
        width: 280px;
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: 600;
      }
      .info {
        font-size: 12px;
        line-height: 1.4;
        margin-bottom: 10px;
        word-break: break-all;
      }
      .label { opacity: 0.6; }
      button {
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 500;
        border: 1px solid #888;
        border-radius: 6px;
        background: #f4f4f4;
        cursor: pointer;
      }
      button:hover { background: #e8e8e8; }
      button:disabled { opacity: 0.6; cursor: progress; }
      #status {
        margin-top: 8px;
        font-size: 12px;
        min-height: 1em;
      }
      #status.ok { color: #2a7a2a; }
      #status.err { color: #b33; }
    </style>
  </head>
  <body>
    <h1>Persona Capture</h1>
    <div class="info">
      <div><span class="label">Title:</span> <span id="page-title">-</span></div>
      <div><span class="label">URL:</span> <span id="page-url">-</span></div>
    </div>
    <button id="save-btn" type="button">Save page to Persona</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
