{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto" x-data="activityFeed()" x-init="init()">
  <div class="mb-6 flex items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight">🔭 Что делает ИИ</h1>
      <p class="text-zinc-500 text-sm mt-1">
        Живая лента вызовов инструментов ассистента — какой инструмент, с чем,
        результат и сколько занял. Обновляется в реальном времени.
      </p>
    </div>
    <div class="flex items-center gap-2 text-xs whitespace-nowrap">
      <span class="inline-flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full"
              :class="connected ? 'bg-emerald-400' : 'bg-zinc-600'"></span>
        <span class="text-zinc-400" x-text="connected ? 'в эфире' : 'нет связи'"></span>
      </span>
      <button @click="reload()"
              class="px-2.5 py-1 rounded-md border border-ink-700 text-zinc-300 hover:bg-ink-800 transition">
        ↻ {{ t('activity_refresh') }}
      </button>
    </div>
  </div>

  <!-- F6-10: фильтр/поиск ленты активности (инструмент / статус / сессия) -->
  <div class="mb-4 flex flex-wrap items-center gap-2 text-xs">
    <input type="text" x-model.debounce.300ms="f.tool" @input="applyFilters()"
           placeholder="{{ t('activity_filter_tool') }}"
           class="flex-1 min-w-[10rem] px-2.5 py-1.5 rounded-md border border-ink-700 bg-ink-800 text-zinc-200 placeholder-zinc-600 focus:border-accent-300 outline-none">
    <select x-model="f.status" @change="applyFilters()"
            class="px-2.5 py-1.5 rounded-md border border-ink-700 bg-ink-800 text-zinc-200 focus:border-accent-300 outline-none">
      <option value="">{{ t('activity_filter_status_any') }}</option>
      <option value="running">{{ t('activity_status_running') }}</option>
      <option value="done">{{ t('activity_status_done') }}</option>
      <option value="error">{{ t('activity_status_error') }}</option>
    </select>
    <input type="number" min="1" x-model.debounce.300ms="f.session" @input="applyFilters()"
           placeholder="{{ t('activity_filter_session') }}"
           class="w-32 px-2.5 py-1.5 rounded-md border border-ink-700 bg-ink-800 text-zinc-200 placeholder-zinc-600 focus:border-accent-300 outline-none">
    <button x-show="hasFilters()" @click="clearFilters()"
            class="px-2.5 py-1.5 rounded-md border border-ink-700 text-zinc-400 hover:bg-ink-800 transition">
      ✕ {{ t('activity_filter_clear') }}
    </button>
  </div>

  <template x-if="items.length === 0">
    <div class="rounded-xl border border-ink-700 bg-ink-800 p-8 text-center text-zinc-500 text-sm">
      <span x-show="!hasFilters()">{{ t('activity_empty') }}</span>
      <span x-show="hasFilters()">{{ t('activity_empty_filtered') }}</span>
    </div>
  </template>

  <div class="space-y-2">
    <template x-for="it in items" :key="it.id">
      <div class="rounded-xl border bg-ink-800 p-4 transition"
           :class="it.status === 'error' ? 'border-red-500/40'
                   : (it.status === 'running' ? 'border-amber-400/40' : 'border-ink-700')">
        <div class="flex items-center gap-3">
          <span class="text-lg leading-none" x-text="kindIcon(it.kind)"></span>
          <span class="font-mono text-sm text-accent-300 font-medium" x-text="it.tool"></span>
          <span class="text-[11px] px-2 py-0.5 rounded-full font-medium"
                :class="badgeClass(it.status)"
                x-text="statusLabel(it.status)"></span>
          <span class="ml-auto text-[11px] text-zinc-500"
                x-text="(it.elapsed_ms != null ? it.elapsed_ms + ' мс · ' : '') + fmtTime(it.started_at)"></span>
        </div>

        <template x-if="it.args">
          <div class="mt-2">
            <pre class="text-[11px] text-zinc-400 bg-ink-900 rounded-md px-2.5 py-1.5 overflow-x-auto whitespace-pre-wrap break-all" x-text="prettyArgs(it.args)"></pre>
          </div>
        </template>

        <template x-if="it.error">
          <p class="mt-2 text-xs text-red-300 whitespace-pre-wrap break-words" x-text="truncate(it.error, 600)"></p>
        </template>

        <template x-if="it.result && it.status !== 'error'">
          <div class="mt-2" x-data="{ open:false }">
            <button @click="open=!open" class="text-[11px] text-zinc-500 hover:text-zinc-300">
              <span x-text="open ? '▾ результат' : '▸ результат'"></span>
            </button>
            <pre x-show="open" x-cloak class="mt-1 text-[11px] text-zinc-400 bg-ink-900 rounded-md px-2.5 py-1.5 overflow-x-auto whitespace-pre-wrap break-words" x-text="truncate(it.result, 2000)"></pre>
          </div>
        </template>

        <!-- F6-05: артефакты (скриншоты браузер-агента и др. файлы) -->
        <template x-if="artifactList(it).length">
          <div class="mt-2.5 flex flex-wrap gap-2">
            <template x-for="a in artifactList(it)" :key="a.url">
              <div>
                <a x-show="isImage(a)" :href="a.url" target="_blank" rel="noopener"
                   class="block rounded-lg overflow-hidden border border-ink-700 hover:border-accent-300 transition"
                   title="{{ t('activity_artifact_open') }}">
                  <img :src="a.url" loading="lazy" alt=""
                       class="h-28 w-auto max-w-[14rem] object-cover bg-ink-900" />
                </a>
                <a x-show="!isImage(a)" :href="a.url" target="_blank" rel="noopener"
                   class="inline-flex items-center gap-1.5 text-[11px] px-2.5 py-1 rounded-md border border-ink-700 text-zinc-300 hover:bg-ink-800 hover:text-accent-300 transition">
                  📎 <span x-text="artifactLabel(a)"></span>
                </a>
              </div>
            </template>
          </div>
        </template>

        <template x-if="it.session_id">
          <a :href="'/chat?session=' + it.session_id"
             class="mt-2 inline-block text-[11px] text-zinc-600 hover:text-accent-300">
            → к чату #<span x-text="it.session_id"></span>
          </a>
        </template>
      </div>
    </template>
  </div>
</div>

<script>
function activityFeed() {
  return {
    items: [],
    connected: false,
    _es: null,
    _t: null,                       // F6-10: дебаунс перезагрузки по фильтрам
    f: { tool: '', status: '', session: '' },  // F6-10: активные фильтры
    async init() {
      await this.reload();
      this.connect();
    },
    // F6-10 — собрать query-строку из активных фильтров (аддитивно).
    _query() {
      const p = new URLSearchParams();
      if (this.f.tool && this.f.tool.trim()) p.set('tool', this.f.tool.trim());
      if (this.f.status) p.set('status', this.f.status);
      if (this.f.session && String(this.f.session).trim()) p.set('session', String(this.f.session).trim());
      const qs = p.toString();
      return qs ? ('?' + qs) : '';
    },
    hasFilters() {
      return !!(this.f.tool && this.f.tool.trim()) || !!this.f.status
             || !!(this.f.session && String(this.f.session).trim());
    },
    clearFilters() {
      this.f = { tool: '', status: '', session: '' };
      this.reload();
    },
    // Дебаунс — не дёргаем сервер на каждый символ.
    applyFilters() {
      if (this._t) clearTimeout(this._t);
      this._t = setTimeout(() => this.reload(), 250);
    },
    // F6-10 — соответствует ли SSE-элемент текущим фильтрам (для live-ленты).
    matchesFilters(p) {
      if (this.f.tool && this.f.tool.trim()) {
        const tn = String(p.tool || '').toLowerCase();
        if (!tn.includes(this.f.tool.trim().toLowerCase())) return false;
      }
      if (this.f.status && String(p.status || '') !== this.f.status) return false;
      if (this.f.session && String(this.f.session).trim()) {
        if (String(p.session_id ?? '') !== String(this.f.session).trim()) return false;
      }
      return true;
    },
    async reload() {
      try {
        const r = await fetch('/api/activity/recent' + this._query(), { headers: { 'Accept': 'application/json' } });
        if (!r.ok) return;
        const data = await r.json();
        this.items = (data.items || []);
      } catch (e) { /* best-effort */ }
    },
    connect() {
      try {
        this._es = new EventSource('/events');
        this._es.onopen = () => { this.connected = true; };
        this._es.onerror = () => { this.connected = false; };
        this._es.onmessage = (ev) => {
          let frame;
          try { frame = JSON.parse(ev.data); } catch (e) { return; }
          if (!frame || frame.type !== 'activity') return;
          this.upsert(frame.payload || {});
        };
      } catch (e) { /* SSE unsupported */ }
    },
    upsert(p) {
      const id = p.exec_id;
      if (id == null) return;
      const idx = this.items.findIndex(x => x.id === id);
      // F6-10: при активном фильтре НОВЫЕ несовпадающие элементы не вставляем
      // (уже показанные продолжаем обновлять — иначе running→done «зависнет»).
      if (idx < 0 && this.hasFilters() && !this.matchesFilters(p)) return;
      const next = {
        id: id,
        session_id: p.session_id ?? null,
        kind: p.kind || 'builtin',
        tool: p.tool || '?',
        args: (typeof p.args === 'string') ? p.args : (p.args != null ? JSON.stringify(p.args) : null),
        status: p.status || 'running',
        result: p.result ?? (idx >= 0 ? this.items[idx].result : null),
        error: p.error ?? (idx >= 0 ? this.items[idx].error : null),
        elapsed_ms: p.elapsed_ms ?? (idx >= 0 ? this.items[idx].elapsed_ms : null),
        started_at: (idx >= 0 ? this.items[idx].started_at : null),
        // F6-05: артефакты приходят либо списком (из /recent), либо одиночным
        // url в SSE-фрейме (publish_activity). Безопасно сводим к списку.
        artifacts: (Array.isArray(p.artifacts) ? p.artifacts
                    : (idx >= 0 ? (this.items[idx].artifacts || []) : [])),
        artifact: p.artifact ?? (idx >= 0 ? this.items[idx].artifact : null),
      };
      if (idx >= 0) {
        // сохраняем уже известные поля, обновляем статус/результат
        this.items[idx] = { ...this.items[idx], ...next };
      } else {
        this.items.unshift(next);
        if (this.items.length > 200) this.items.pop();
      }
    },
    // F6-05 — артефакты. Безопасность: показываем ТОЛЬКО ссылки под
    // /workspace/file/ (workspace-only). Чужие/абсолютные url отбрасываем.
    _safeUrl(u) {
      u = String(u == null ? '' : u);
      return u.startsWith('/workspace/file/') ? u : null;
    },
    artifactList(it) {
      const out = [];
      const seen = new Set();
      const push = (a) => {
        if (!a) return;
        const url = this._safeUrl(typeof a === 'string' ? a : a.url);
        if (!url || seen.has(url)) return;
        seen.add(url);
        out.push({ url, type: (a && a.type) || '', mime_type: (a && a.mime_type) || '' });
      };
      if (Array.isArray(it.artifacts)) it.artifacts.forEach(push);
      if (it.artifact) push(it.artifact);   // одиночный из SSE
      return out;
    },
    isImage(a) {
      const m = String(a.mime_type || '').toLowerCase();
      if (m.startsWith('image/')) return true;
      if (a.type === 'screenshot' || a.type === 'image') return true;
      return /\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(a.url || '');
    },
    artifactLabel(a) {
      const u = String(a.url || '');
      const name = u.split('/').pop() || u;
      return name.length > 40 ? name.slice(0, 39) + '…' : name;
    },
    kindIcon(k) { return k === 'browser' ? '🌐' : (k === 'mcp' ? '🔌' : '🔧'); },
    statusLabel(s) { return s === 'error' ? 'ошибка' : (s === 'running' ? 'выполняется…' : 'готово'); },
    badgeClass(s) {
      if (s === 'error') return 'bg-red-500/15 text-red-300';
      if (s === 'running') return 'bg-amber-400/15 text-amber-300 animate-pulse';
      return 'bg-emerald-500/15 text-emerald-300';
    },
    prettyArgs(a) {
      try { return JSON.stringify(JSON.parse(a), null, 1); } catch (e) { return String(a); }
    },
    truncate(s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n) + '…' : s; },
    fmtTime(t) {
      if (!t) return '';
      try { return new Date(t.replace(' ', 'T') + 'Z').toLocaleTimeString(); } catch (e) { return t; }
    },
  };
}
</script>
{% endblock %}
