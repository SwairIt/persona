<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ title }} — Persona</title>
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <meta name="theme-color" content="#6366f1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: {
      ink: { 950: '#0a0a0c', 900: '#111114', 800: '#1a1a1f', 700: '#26262e' },
      accent: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' }
    } } } }
  </script>
</head>
<body class="bg-ink-950 text-zinc-100 min-h-screen flex items-center justify-center font-sans antialiased px-4">

  <div class="w-full max-w-sm">
    <a href="/landing" class="flex items-center justify-center gap-2 mb-8 text-zinc-400 hover:text-zinc-100">
      <span class="text-3xl leading-none">●</span>
      <span class="font-bold tracking-tight text-lg">Persona</span>
    </a>

    <div class="rounded-xl border border-zinc-700 bg-ink-900 p-6 shadow-2xl">
      <h1 class="text-xl font-bold mb-1">Создать аккаунт</h1>
      <p class="text-xs text-zinc-500 mb-5">
        Достаточно email и пароля.
      </p>

      {% if error %}
        <div class="mb-4 px-3 py-2 rounded bg-rose-900/40 border border-rose-700 text-sm text-rose-200">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" action="/auth/signup" class="space-y-3">
        <label class="block">
          <span class="text-xs text-zinc-400 mb-1 block">Email</span>
          <input type="email" name="email" required value="{{ email }}" autocomplete="email"
                 class="w-full px-3 py-2 rounded border border-zinc-700 bg-ink-800 text-base focus:outline-none focus:border-accent-500">
        </label>
        <label class="block">
          <span class="text-xs text-zinc-400 mb-1 block">Пароль</span>
          <input type="password" name="password" required minlength="8" autocomplete="new-password"
                 class="w-full px-3 py-2 rounded border border-zinc-700 bg-ink-800 text-base focus:outline-none focus:border-accent-500">
          <span class="text-[10px] text-zinc-500 mt-1 block">Минимум 8 символов.</span>
        </label>
        <label class="block">
          <span class="text-xs text-zinc-400 mb-1 block">Имя <span class="text-zinc-600">(необязательно)</span></span>
          <input type="text" name="display_name" maxlength="64"
                 class="w-full px-3 py-2 rounded border border-zinc-700 bg-ink-800 text-base focus:outline-none focus:border-accent-500">
        </label>
        <button type="submit"
                class="w-full mt-4 px-4 py-3 rounded bg-accent-600 text-white font-semibold hover:bg-accent-500 transition">
          Создать аккаунт
        </button>
      </form>

      <p class="text-center text-xs text-zinc-500 mt-5">
        Уже есть аккаунт?
        <a href="/auth/login" class="text-accent-400 hover:underline">Войти</a>
      </p>
    </div>
  </div>

</body>
</html>
