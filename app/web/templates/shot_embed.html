<!DOCTYPE html>
<html lang="en" data-theme="{{ theme }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <style>
    /* Self-contained styling: no Tailwind / external CSS so the iframe
       boots instantly on hosts without internet access, and so the
       embedder's stylesheet cannot accidentally cascade into us. */

    :root {
      --bg: #0a0a0c;
      --fg: #e4e4e7;
      --muted: #71717a;
      --card: #18181b;
      --border: #27272a;
      --link: #a1a1aa;
      --link-hover: #f4f4f5;
    }

    html[data-theme="light"] {
      --bg: #fafafa;
      --fg: #18181b;
      --muted: #71717a;
      --card: #ffffff;
      --border: #e4e4e7;
      --link: #52525b;
      --link-hover: #18181b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .wrap {
      max-width: 100%;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    figure {
      margin: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .shot {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }

    .missing {
      padding: 32px 12px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    figcaption {
      padding: 8px 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--fg);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .meta strong {
      color: var(--fg);
      font-weight: 600;
    }

    .ocr {
      margin: 0;
      color: var(--fg);
      font-size: 12px;
      word-break: break-word;
    }

    footer {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      padding: 2px 4px 4px;
    }

    footer a {
      color: var(--link);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    /* 320px is the lower bound called out in the spec. The fluid
       defaults already handle it; this rule just tightens padding so
       the footer line does not wrap awkwardly at the narrowest size. */
    @media (max-width: 360px) {
      .wrap { padding: 6px; gap: 6px; }
      figcaption { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <figure>
      {% if shot.thumbnail_path %}
        <img class="shot"
             src="{{ shot.thumbnail_path | thumbnail_url }}"
             alt="Screenshot #{{ shot.id }}"
             loading="lazy">
      {% else %}
        <div class="missing">Image no longer available.</div>
      {% endif %}
      <figcaption>
        <div class="meta">
          {% if shot.app_name %}
            <span><strong>{{ shot.app_name }}</strong></span>
          {% endif %}
          <span>{{ shot.captured_at | humantime }}</span>
        </div>
        {% if ocr_snippet %}
          <p class="ocr">{{ ocr_snippet }}</p>
        {% endif %}
      </figcaption>
    </figure>

    <footer>
      <a href="https://github.com/SwairIt/Persona"
         target="_blank" rel="noopener noreferrer">Persona</a>
    </footer>
  </div>
</body>
</html>
