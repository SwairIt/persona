<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #0a0a0c;
      color: #e4e4e7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8">
    <figure class="rounded-lg overflow-hidden border border-zinc-800 bg-black">
      {% if shot.thumbnail_path %}
        <img src="{{ shot.thumbnail_path | thumbnail_url }}"
             alt="Screenshot #{{ shot.id }}"
             class="w-full object-contain bg-black">
      {% else %}
        <div class="aspect-video flex items-center justify-center text-zinc-500 text-sm">
          Image no longer available.
        </div>
      {% endif %}
      {% if caption %}
        <figcaption class="px-5 py-4 text-sm text-zinc-300 border-t border-zinc-800 whitespace-pre-wrap leading-relaxed">
          {{ caption }}
        </figcaption>
      {% endif %}
    </figure>

    <dl class="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-zinc-500">
      <div>
        <dt class="uppercase tracking-widest">Captured</dt>
        <dd class="text-zinc-300 font-mono mt-1">{{ shot.captured_at | humantime }}</dd>
      </div>
      {% if shot.app_name %}
        <div>
          <dt class="uppercase tracking-widest">App</dt>
          <dd class="text-zinc-300 mt-1 truncate" title="{{ shot.app_name }}">{{ shot.app_name }}</dd>
        </div>
      {% endif %}
      {% if shot.window_title %}
        <div>
          <dt class="uppercase tracking-widest">Window</dt>
          <dd class="text-zinc-300 mt-1 truncate" title="{{ shot.window_title }}">{{ shot.window_title }}</dd>
        </div>
      {% endif %}
    </dl>
  </main>

  <footer class="border-t border-zinc-900 py-4 text-center text-[11px] text-zinc-600">
    Generated by
    <a href="https://github.com/SwairIt/Persona" target="_blank" rel="noopener noreferrer"
       class="text-zinc-400 hover:text-zinc-200 underline-offset-2 hover:underline">
      Persona
    </a>
    &middot; read-only, time-limited link
  </footer>
</body>
</html>
